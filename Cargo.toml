# One library, two interfaces (docs/adr/0004): amd-lib, the `amd` command
# line, and the `amdui` desktop board — a Tauri backend (amd-ui) with a
# Leptos front end compiled to WebAssembly (amd-ui-web) and the types the two
# share (amd-ui-model).
#
# The boundary is enforced here rather than by review — amd-lib does not list
# clap, inquire, Tauri or Leptos, so a front-end dependency reaching into the
# library fails to compile rather than passing review.
[workspace]
resolver = "3"
members = [
    "crates/amd-lib",
    "crates/amd-cli",
    "crates/amd-ui",
    "crates/amd-ui-model",
    "crates/amd-ui-web",
]

[workspace.package]
version = "4.3.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/agile-md/amd"
license = "MIT"

[workspace.dependencies]
agile-md = { path = "crates/amd-lib" }
amd-ui-model = { path = "crates/amd-ui-model" }
anyhow = "1"
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
deunicode = "1.6.2"
inquire = "0.9"
libc = "0.2.189"
minijinja = "3"
richrs = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset", "macros"] }

# The desktop board (crates/amd-ui*).
tauri = "2.12"
tauri-build = "2.7"
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.22"
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
# The bottom panel's terminal (ticket 185): the engine Alacritty and Zed use.
alacritty_terminal = "0.26"
# Speech to text (ticket 187): Whisper on the CPU, the microphone, and the
# one-off model download.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
cpal = "0.18"
ureq = "3"

# Dependencies without debug information (ticket 187): candle's made the
# debug build big enough to fill a CI runner's disk while linking amdui
# (the linker died with a bus error). Our own crates keep theirs.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
